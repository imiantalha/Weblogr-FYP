name: PHP Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, fileinfo

      - name: Validate Composer configuration
        run: composer validate --working-dir=registration

      - name: Lint application PHP files
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' \
            -not -path './registration/vendor/*' \
            -not -path './registration/smtp/*' \
            -print0 | while IFS= read -r -d '' file; do
              php -l "$file"
            done
